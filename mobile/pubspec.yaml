name: myzeptotracker
description: Location-aware inventory monitor with Android notifications and a laptop backend.
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.16.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  shared_preferences: ^2.3.0
  flutter_local_notifications: ^17.0.0
  flutter_foreground_task: ^8.0.0
  file_picker: ^8.0.0
  url_launcher: ^6.2.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/default_locations.json
